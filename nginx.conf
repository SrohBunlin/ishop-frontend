server {
    listen 80;
    resolver 8.8.8.8;
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # បន្ថែម Security Headers សម្រាប់ Frontend ឱ្យបាន Grade A
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "no-referrer-when-downgrade" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
                add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # កន្លែងសំខាន់សម្រាប់ដោះស្រាយ Error 502
    location /api/ {
        # ប្តូរទៅជា URL របស់ Backend លើ Railway របស់អ្នក
        proxy_pass https://practical-light-production-55fd.up.railway.app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

}